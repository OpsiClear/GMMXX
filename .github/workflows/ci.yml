name: CI

on:
  push:
  pull_request:

jobs:
  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packaging tools
        run: python -m pip install --upgrade pip pytest

      - name: Install package metadata without runtime dependencies
        run: python -m pip install -e . --no-deps

      - name: Validate platform dependency markers
        run: python -m pytest tests/test_packaging.py -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
